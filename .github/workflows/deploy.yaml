name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger the pipeline automatically whenever you push code to main

jobs:
  continuous-integration:
    name: Code Verification (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.13 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Syntax Lint Check (Flake8)
        run: |
          pip install flake8
          # Stop the build if there are critical Python syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  continuous-deployment:
    name: Cloud Server Deployment (CD)
    needs: continuous-integration  # Only deploy if the CI verification steps pass perfectly!
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Container Rebuild
        # This official action securely triggers Render to build your Dockerfile
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
